[build]
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# --- Backend Service ---
[[services]]
name = "backend"
root = "apps/backend"

[services.build]
dockerfile = "Dockerfile"

[services.env]
PORT = "8080"
NODE_ENV = "production"

# --- Uploads (Artikelbilder, Belegnachweise, Werbung) ---
# Der Container hat kein dauerhaftes Dateisystem: ohne Volume sind alle Uploads nach jedem
# Deploy oder Neustart weg. Railway-Volumes lassen sich nicht in dieser Datei anlegen,
# sondern einmalig im Dashboard oder per CLI:
#
#   railway volume add --service backend --mount-path /app/uploads
#   (Dashboard: Projekt-Canvas -> Rechtsklick -> "Volume" -> Service "backend", Mount Path /app/uploads)
#
# Railway setzt dann RAILWAY_VOLUME_MOUNT_PATH, das der Backend-Code automatisch als Upload-Ordner
# nutzt (apps/backend/src/utils/uploadsDir.js). Ein anderer Pfad braucht keine Code-Aenderung.
# Alternativ laesst sich der Ordner explizit mit UPLOADS_DIR setzen.
# Das Image laeuft als root, daher ist RAILWAY_RUN_UID nicht noetig; bei Wechsel auf USER nodejs
# im Dockerfile zusaetzlich RAILWAY_RUN_UID=0 setzen (Railway-Doku zu Volumes).

# --- Frontend Service ---
[[services]]
name = "frontend"
root = "apps/frontend"

[services.build]
dockerfile = "Dockerfile"
args = { REACT_APP_API_URL = "/api", REACT_APP_WS_URL = "/" }

[services.env]
# This will be set by Railway automatically if you link services, 
# but we need to ensure Nginx gets it.
# We will set BACKEND_URL in the Railway Dashboard to the internal backend URL.
