server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads
    client_max_body_size 500M;

    # Backend-Adresse zur Laufzeit auflösen statt einmal beim Start: nach einem Backend-Deploy hat
    # der Container eine neue interne IP, mit der gemerkten alten liefen alle /api-Anfragen ins Leere.
    # NGINX_RESOLVER kommt beim Start aus /etc/resolv.conf (siehe Dockerfile). Weil proxy_pass eine
    # Variable nutzt, wird die Anfrage-URI unverändert weitergereicht (/api/..., /uploads/..., /socket.io/...).
    resolver $NGINX_RESOLVER valid=10s;
    set $backend_upstream $BACKEND_URL;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Ein add_header im location-Block hebt die Header des server-Blocks auf, daher wiederholen
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # Proxy API requests
    location /api {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Uploads (Force prefix match with ^~ to skip regex static asset check)
    location ^~ /uploads {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket
    location /socket.io {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (gelten für alle location-Blöcke ohne eigenes add_header)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nur über HTTPS wirksam (Railway); Browser ignorieren den Header bei http im LAN
    add_header Strict-Transport-Security "max-age=15552000" always;
}
